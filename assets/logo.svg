<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="FloralPlayer">
  <defs>
    <linearGradient id="fpTile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e2f22"/>
      <stop offset="1" stop-color="#121209"/>
    </linearGradient>
    <radialGradient id="fpGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a0a163" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a0a163" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fpPetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9da9e"/>
      <stop offset="0.55" stop-color="#a0a163"/>
      <stop offset="1" stop-color="#6e6f3f"/>
    </linearGradient>
    <radialGradient id="fpHeart" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fbfbef"/>
      <stop offset="1" stop-color="#dcdcc4"/>
    </radialGradient>
    <path id="fpP" d="M128 118C86 100 80 42 128 20C176 42 170 100 128 118Z"/>
  </defs>

  <!-- Tuile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#fpTile)"/>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  <circle cx="128" cy="132" r="112" fill="url(#fpGlow)"/>

  <!-- Fleur à cinq pétales -->
  <g transform="translate(0 6)" stroke="#1b1c12" stroke-width="5" stroke-linejoin="round" fill="url(#fpPetal)">
    <use href="#fpP"/>
    <use href="#fpP" transform="rotate(72 128 128)"/>
    <use href="#fpP" transform="rotate(144 128 128)"/>
    <use href="#fpP" transform="rotate(216 128 128)"/>
    <use href="#fpP" transform="rotate(288 128 128)"/>
  </g>

  <!-- Cœur : bouton lecture -->
  <circle cx="128" cy="134" r="38" fill="url(#fpHeart)" stroke="#1b1c12" stroke-width="5"/>
  <path d="M117 115L148 134L117 153Z" fill="#3a3b24" stroke="#3a3b24" stroke-width="7" stroke-linejoin="round"/>
</svg>
